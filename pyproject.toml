[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-summarization"
version = "1.0.0"
description = "Intent-Aware Event-Centric Multimodal Video Summarization System"
readme = "README.md"
requires-python = ">=3.10, <=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "scenedetect[opencv]>=0.6.2",
    "imageio-ffmpeg>=0.4.9",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
